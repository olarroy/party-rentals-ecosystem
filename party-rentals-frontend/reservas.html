<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Pequefest.com</title>
    <meta name="description"
        content="Reserva tu castillo inflable online en Pequefest.com. Calendario en tiempo real con disponibilidad instantánea.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Styles -->
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/booking.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Header Component Placeholder -->
    <div data-component="header"></div>

    <!-- Breadcrumb -->
    <section class="breadcrumb">
        <div class="container">
            <nav class="breadcrumb-nav">
                <a href="index.html">Inicio</a>
                <span>→</span>
                <span>Reservas</span>
            </nav>
        </div>
    </section>

    <!-- Modern Booking Section -->
    <section class="booking-section">
        <div class="container">
            <div class="booking-grid">

                <!-- Columna Izquierda: Selección -->
                <div class="booking-left">
                    <h2>1. Elige tu Inflable</h2>
                    <div class="inflatable-selector-grid">
                        <!-- Card Large -->
                        <label class="inflatable-select-card" for="large">
                            <input type="radio" name="inflatable" id="large" value="LARGE" checked>
                            <div class="card-content">
                                <span class="icon">🏰</span>
                                <h3>Castillo Grande</h3>
                                <p>10-15 niños • 6x6x4m</p>
                                <span class="price-tag">€80/día</span>
                            </div>
                        </label>

                        <!-- Card Small -->
                        <label class="inflatable-select-card" for="small">
                            <input type="radio" name="inflatable" id="small" value="SMALL">
                            <div class="card-content">
                                <span class="icon">🎪</span>
                                <h3>Castillo Pequeño</h3>
                                <p>5-8 niños • 4x4x3m</p>
                                <span class="price-tag">€60/día</span>
                            </div>
                        </label>
                    </div>

                    <h2 class="mt-8">2. Selecciona Fecha</h2>
                    <div class="calendar-wrapper">
                        <input type="text" id="datePicker" placeholder="Selecciona una fecha">

                        <!-- Calendar Legend -->
                        <div class="calendar-legend mt-4"
                            style="display: flex; gap: 1rem; justify-content: center; font-size: 0.9rem; color: #666;">
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <span
                                    style="width: 10px; height: 10px; background: #fff; border: 1px solid #ddd; border-radius: 50%;"></span>
                                libre
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <span
                                    style="width: 10px; height: 10px; background: #ff4d4f; border-radius: 50%;"></span>
                                ocupado
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <span
                                    style="width: 10px; height: 10px; background: #ff0055; border-radius: 50%;"></span>
                                seleccionado
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Formulario Resumen (Sticky) -->
                <div class="booking-right">
                    <div class="booking-summary-card">
                        <h3>Resumen de Reserva</h3>

                        <div id="summary-details">
                            <div class="summary-row">
                                <span>Inflable:</span>
                                <strong id="summary-infl">Castillo Grande</strong>
                            </div>
                            <div class="summary-row">
                                <span>Fecha:</span>
                                <strong id="summary-date">--/--/----</strong>
                            </div>
                            <div class="summary-divider"></div>
                            <div class="summary-total">
                                <span>Total estimado:</span>
                                <span id="summary-price">€80</span>
                            </div>
                        </div>

                        <form id="booking-form" class="mt-6">
                            <div class="form-group">
                                <label>Nombre Completo</label>
                                <input type="text" name="customer-name" required class="modern-input"
                                    placeholder="Tu nombre">
                            </div>
                            <div class="form-group">
                                <label>Teléfono (WhatsApp)</label>
                                <input type="tel" name="customer-phone" required class="modern-input"
                                    placeholder="+34 600 000 000">
                            </div>
                            <div class="form-group">
                                <label>Dirección del Evento</label>
                                <textarea name="customer-address" required class="modern-input" rows="2"
                                    placeholder="Calle, Número, Ciudad"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block mt-4" id="submit-btn">
                                ✅ Confirmar Reserva
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Flatpickr CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <!-- Footer Component Placeholder -->
    <div data-component="footer"></div>

    <!-- Supabase & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="src/js/env.js"></script>
    <script type="module" src="src/js/config.js"></script>

    <!-- Scripts -->
    <script src="src/js/component-loader.js"></script>
    <script src="src/js/config-manager.js"></script>
    <script src="src/js/email-service.js"></script>
    <script src="src/js/telegram-integration.js"></script>
    <script src="src/js/main.js"></script>
    <script src="src/js/booking.js"></script>
</body>

</html>
