services:
  - type: web
    name: mcp-orchestrator-bot
    env: node
    plan: free
    buildCommand: cd mcp-orchestrator && npm install && npm run build
    startCommand: cd mcp-orchestrator && npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
